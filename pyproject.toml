[project]
name = "neuron-dj"
version = "0.1.0"
description = "Local companion chat and controlled personality experiments"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
model = ["torch==2.14.1", "transformers==5.20.0", "accelerate>=1.10,<2", "psutil>=7,<8"]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
include = ["services*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
